; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; CPU/Flash
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_upload.flash_size = 4MB

; Partition Scheme: 4MB with SPIFFS (1.2MB APP / 1.5MB SPIFFS)
board_build.partitions = default.csv

; Monitor
monitor_speed = 115200

; Upload
upload_speed = 921600

; Arduino runs on Core 1, Events on Core 1
board_build.arduino.arduino_core = 1
board_build.arduino.event_core = 1

; Debug Level: None (default)
board_build.debug_level = 0

; ============================================================
; 外部库依赖
; ============================================================
lib_deps =
    https://github.com/robopeak/rplidar_arduino.git

; 编译后自动修复 RPLIDAR 库的 ESP32 兼容性问题
extra_scripts = pre:fix_rplidar.py
